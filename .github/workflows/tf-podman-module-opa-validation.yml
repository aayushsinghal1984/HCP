name:  UL-IAC Terraform OPA Security and Compliance Validation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options:
          - Development
          - production

      module_name:
        description: Child module name
        required: true
        type: choice
        options:
          - application-insights
          - budget-resource-group
          - budget-subscription
          - disk-access
          - disk-encryption-set
          - key-vault
          - key-vault-access-policy
          - key-vault-key
          - key-vault-secret
          - lb-backend-address-pool
          - lb-backend-address-pool-address
          - lb-outbound-rule
          - lb-probe
          - lb-rule
          - linux-virtual-machine
          - load-balancer
          - log-analytics-workspace
          - management-group
          - monitor-action-group
          - monitor-diagnostic-setting
          - mssql-database
          - mssql-server
          - network-interface
          - network-security-group
          - network-security-rule
          - policy-assignment
          - policy-definition
          - privated-dnszone
          - private-dns-a-record
          - private-dns-resolver
          - private-dns-resolver-dns-forwarding-ruleset
          - private-dns-resolver-forwarding-rule
          - private-dns-resolver-inbound-endpoint
          - private-dns-resolver-outbound-endpoint
          - private-endpoint
          - public-ip
          - resource-group
          - storage-account
          - storage-account-container
          - storage-account-customer-managed-key
          - storage-blob
          - storage-share
          - subnet
          - virtual-network
          - virtual-network-peering
          - windows-virtual-machine
          - managed-disk 
          - firewall 
          - monitor-activity-log-alert
          - monitor-alert-processing-rule-action-group 
          - managed-disk
          - bastion-host 
          - virtual-machine-data-disk-attachment
          - role-definition
          - role-assignment
          - user-assigned-identity
          - windows-web-app-slot
          - linux-web-app-slot
          - virtual-machine-extension
          - windows-web-app
          - linux-web-app
          - app-service-plan
          
          

permissions:
  id-token: write
  contents: read
  security-events: write

